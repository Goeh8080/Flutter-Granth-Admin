name: Build APK

run-name: Round 3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Round-3-universal
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build arm64-v8a release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: Round-3-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publish "Round 3" prerelease
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "round-3-run${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Round 3" \
            --notes "Round 3 build of ${{ github.sha }} (run ${{ github.run_id }})." \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
