name: Build APK

run-name: Round-1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_SHA1_PLAIN: "469bb022699ee166c44aa316d44ef25237319fb1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze (info-level lints do not fail)
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Inject Firebase config and admin signing key (from secrets, never logged)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ADMIN_KEYSTORE_B64: ${{ secrets.ADMIN_KEYSTORE_B64 }}
          ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ADMIN_KEYSTORE_PASSWORD }}
        run: |
          set +x
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "google-services.json written"; else echo "GOOGLE_SERVICES_JSON not set"; fi
          if [ -z "$ADMIN_KEYSTORE_B64" ] || [ -z "$ADMIN_KEYSTORE_PASSWORD" ]; then echo "::error::ADMIN_KEYSTORE secrets missing"; exit 1; fi
          printf '%s' "$ADMIN_KEYSTORE_B64" | base64 -d > android/app/admin-release.p12
          printf 'storeFile=admin-release.p12\nstorePassword=%s\nkeyAlias=granthadmin\nkeyPassword=%s\n' "$ADMIN_KEYSTORE_PASSWORD" "$ADMIN_KEYSTORE_PASSWORD" > android/key.properties
          echo "admin signing key configured"

      - name: Build universal + arm64 APKs (1.0.0+1)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set +x
          args="--build-name=1.0.0 --build-number=1"
          if [ -n "$APP_KEY" ]; then
            printf '{"APP_KEY":"%s"}' "$APP_KEY" > "$RUNNER_TEMP/dd.json"
            args="$args --dart-define-from-file=$RUNNER_TEMP/dd.json"
          fi
          flutter build apk --release $args
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/universal.apk"
          flutter build apk --release --split-per-abi --target-platform android-arm64 $args
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$RUNNER_TEMP/arm64.apk"
          rm -f "$RUNNER_TEMP/dd.json"

      - name: Align, re-sign (v1+v2+v3) and verify APKs
        env:
          ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ADMIN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          mkdir -p out
          resign() { # $1 = input apk, $2 = output apk
            W="$RUNNER_TEMP/w"; rm -rf "$W"; mkdir -p "$W"
            cp "$1" "$W/in.apk"
            zip -q -d "$W/in.apk" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
            "$BT/zipalign" -P 16 -f 4 "$W/in.apk" "$W/aligned.apk"
            "$BT/apksigner" sign --ks android/app/admin-release.p12 --ks-type PKCS12 --ks-key-alias granthadmin \
              --ks-pass env:ADMIN_KEYSTORE_PASSWORD --key-pass env:ADMIN_KEYSTORE_PASSWORD \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$2" "$W/aligned.apk"
            "$BT/zipalign" -c -P 16 4 "$2" && echo "zipalign check OK: $2"
            "$BT/apksigner" verify --min-sdk-version 21 --print-certs -v "$2" | tee "$W/verify.txt"
            for s in 1 2 3; do grep -q "Verified using v$s scheme (APK Signature Scheme v$s): true\|Verified using v$s scheme (JAR signing): true" "$W/verify.txt" || { echo "::error::v$s not verified ($2)"; exit 1; }; done
            grep -qi "SHA-1 digest: $EXPECTED_SHA1_PLAIN" "$W/verify.txt" || { echo "::error::APK cert SHA-1 mismatch ($2)"; exit 1; }
            "$BT/aapt2" dump badging "$2" > "$W/badging.txt"
            grep -E "^package:|native-code" "$W/badging.txt"
            grep -q "versionCode='1' versionName='1.0.0'" "$W/badging.txt" || { echo "::error::wrong version ($2)"; exit 1; }
            if grep -Ei "AD_ID|ADSERVICES" "$W/badging.txt"; then echo "::error::AD_ID/ADSERVICES permission present ($2)"; exit 1; fi
          }
          resign "$RUNNER_TEMP/universal.apk" out/Round-1-universal.apk
          resign "$RUNNER_TEMP/arm64.apk" out/Round-1-arm64.apk
          echo "ALL CHECKS PASSED"; ls -l out

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Round-1-universal
          path: out/Round-1-universal.apk
          if-no-files-found: error

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: Round-1-arm64
          path: out/Round-1-arm64.apk
          if-no-files-found: error

      - name: Publish "Round-1" prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "round-1-run${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Round-1" \
            --notes "Round-1 build 1.0.0+1 (admin-signed v1+v2+v3; contact email in Settings) of ${{ github.sha }} (run ${{ github.run_id }})." \
            out/Round-1-universal.apk \
            out/Round-1-arm64.apk

      - name: Delete key files
        if: always()
        run: rm -f android/app/admin-release.p12 android/key.properties android/app/google-services.json "$RUNNER_TEMP/dd.json"
