name: Build APK

run-name: Round 3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # APP_KEY (optional repository secret) is passed via --dart-define-from-file; without it the build has no key.
      - name: Inject Firebase config and signing key (from secrets, never logged)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ADMIN_KEYSTORE_B64: ${{ secrets.ADMIN_KEYSTORE_B64 }}
          ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ADMIN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "google-services.json written"; else echo "GOOGLE_SERVICES_JSON not set: Google login disabled in this build"; fi
          if [ -n "$ADMIN_KEYSTORE_B64" ]; then
            printf '%s' "$ADMIN_KEYSTORE_B64" | base64 -d > android/app/admin-release.p12
            printf 'storeFile=admin-release.p12\nstorePassword=%s\nkeyAlias=granthadmin\nkeyPassword=%s\n' "$ADMIN_KEYSTORE_PASSWORD" "$ADMIN_KEYSTORE_PASSWORD" > android/key.properties
            echo "fixed admin signing key configured"
          else echo "ADMIN_KEYSTORE_B64 not set: debug signing"; fi

      - name: Build universal release APK
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set +x
          args=""
          if [ -n "$APP_KEY" ]; then
            printf '{"APP_KEY":"%s"}' "$APP_KEY" > "$RUNNER_TEMP/dd.json"
            args="--dart-define-from-file=$RUNNER_TEMP/dd.json"
          fi
          flutter build apk --release $args
          rm -f "$RUNNER_TEMP/dd.json"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Round-3-universal
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build arm64-v8a release APK
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set +x
          args=""
          if [ -n "$APP_KEY" ]; then
            printf '{"APP_KEY":"%s"}' "$APP_KEY" > "$RUNNER_TEMP/dd.json"
            args="--dart-define-from-file=$RUNNER_TEMP/dd.json"
          fi
          flutter build apk --release --split-per-abi --target-platform android-arm64 $args
          rm -f "$RUNNER_TEMP/dd.json"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: Round-3-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publish "Round 3" prerelease
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "round-3-run${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Round 3" \
            --notes "Round 3 build of ${{ github.sha }} (run ${{ github.run_id }})." \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
